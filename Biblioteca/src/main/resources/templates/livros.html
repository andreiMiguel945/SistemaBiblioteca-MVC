<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1 th:text="'Sistema de Biblioteca'"></h1>
<nav>
    <a th:href="@{/livros}">Livros</a>
    <a th:href="@{/livros/autores}">Autores</a>
    <a th:href="@{/livros/categorias}">Categorias</a>
    <a th:href="@{/livros/usuarios}">Usuários</a>
    <a th:href="@{/livros/emprestimos}">Empréstimos</a>
    <a class="link-para-cadastro" th:href="@{/livros/cadastrarLivro}">Cadastrar um livro</a></nav>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Titulo</th>
        <th>Nome do Autor</th>
        <th>Data de Lançamento</th>
        <th>Categoria</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="livro : ${livros}">
        <td th:text="${livro.id}"></td>
        <td th:text="${livro.titulo}"></td>
        <td th:text="${livro.autor}"></td>
        <td th:text="${livro.data_de_lancamento}"></td>
        <td th:text="${livro.categoria.nome}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
