<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Usuário</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>Sistema de Biblioteca</h1>
<nav>
    <a th:href="@{/livros/usuarios}">Voltar</a>
</nav>

<h2>Cadastrar Novo Usuário</h2>
<p>Preencha os dados abaixo para adicionar um usuário ao sistema.</p>

<form class="form-cadastro" th:action="@{/livros/cadastrarUsuario}" th:object="${usuario}" method="post">

    <div class="campo-input">
        <label for="nome"><strong>Nome Completo:</strong></label><br>
        <input type="text" id="nome" th:field="*{nome}" required>
    </div>

    <div class="campo-input">
        <label for="email"><strong>E-mail:</strong></label><br>
        <input type="email" id="email" th:field="*{email}" placeholder="Ex: usuario@email.com" required>
    </div>

    <div class="campo-input">
        <label for="telefone"><strong>Telefone:</strong></label><br>
        <input type="text" id="telefone" th:field="*{telefone}" placeholder="Ex: (41) 99999-9999" required>
    </div>

    <button type="submit" class="button-cadastro">
        Salvar Usuário
    </button>
</form>

</body>
</html>
